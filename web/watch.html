<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="home-link" aria-label="Về trang chủ" title="Trang chủ"><i data-icon="back" data-size="20"></i></a>
    <h1 id="lesson-title">Learn English</h1>
    <nav class="nav">
      <a id="nav-watch" href="watch.html" class="active"><i data-icon="video"></i> Video</a>
      <a id="nav-vocab" href="vocab.html"><i data-icon="book"></i> Từ vựng</a>
    </nav>
  </header>

  <main class="layout">
    <section class="left">
      <div class="view-bar">
        <span class="muted">Video</span>
        <div class="seg" id="view-mode" role="group" aria-label="Kích thước video">
          <button data-view="full" class="active" title="Kích thước đầy đủ">Đầy đủ</button>
          <button data-view="half" title="Thu nhỏ 1/2">1/2</button>
          <button data-view="hidden" title="Ẩn video, chỉ nghe">Ẩn</button>
        </div>
      </div>
      <div class="now-playing" id="now-playing" hidden>
        <button id="np-toggle" class="np-btn" aria-label="Phát / Tạm dừng" title="Phát / Tạm dừng (Space)"></button>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="np-title" id="np-title"></span>
        <span class="np-time" id="np-time">0:00</span>
      </div>
      <div class="player-wrap">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="yt-player" hidden></div>
      </div>
      <div class="player-tools">
        <button id="prev-line" class="round" aria-label="Câu trước" title="Câu trước (Shift+←)"><i data-icon="prev" data-size="20"></i></button>
        <button id="replay-line" class="round big" aria-label="Nghe lại câu" title="Nghe lại câu (R)"><i data-icon="replay" data-size="24"></i></button>
        <button id="next-line" class="round" aria-label="Câu sau" title="Câu sau (Shift+→)"><i data-icon="next" data-size="20"></i></button>
        <label class="toggle"><input type="checkbox" id="loop-line"><span><i data-icon="check" data-size="16"></i>Lặp câu</span></label>
        <label class="toggle"><input type="checkbox" id="loop-part"><span><i data-icon="check" data-size="16"></i>Lặp phần</span></label>
        <label class="speed" title="Tốc độ (nhấp đúp để về 1×)">
          <span>Tốc độ</span>
          <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1">
          <output id="speed-val">1.00×</output>
        </label>
      </div>
      <h2 class="section-title">Các phần <small id="parts-done"></small></h2>
      <ol id="parts" class="parts"></ol>
    </section>

    <section class="right">
      <div class="tabs" role="tablist">
        <button role="tab" data-lang="en" class="tab active">EN</button>
        <button role="tab" data-lang="vi" class="tab">VI</button>
        <button role="tab" data-lang="hide" class="tab" title="Ẩn transcript để luyện nghe">Ẩn</button>
      </div>
      <div id="transcript" class="transcript"></div>
      <div class="legend" id="legend" hidden><i></i>Từ gạch vàng có trong danh sách từ vựng. Bấm để xem nghĩa.</div>
      <div id="tip" class="tip" role="tooltip" hidden></div>
      <div id="word-pop" class="word-pop" hidden></div>
    </section>
  </main>

  <div id="empty" class="empty" hidden>
    <p>Không tìm thấy video này.</p>
    <p><a href="index.html">← Về trang chủ</a></p>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
