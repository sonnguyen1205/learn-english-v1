<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn English</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <header class="topbar">
    <h1>📺 Learn English</h1>
    <span class="muted">Học tiếng Anh qua video</span>
  </header>

  <main class="home-main">
    <section id="continue" class="continue" hidden>
      <a class="continue-thumb" id="c-link"><img id="c-img" alt=""><span class="play">▶</span></a>
      <div class="continue-body">
        <div class="eyebrow">Tiếp tục xem</div>
        <h2 id="c-title"></h2>
        <p class="muted" id="c-where"></p>
        <div class="bar"><i id="c-bar"></i></div>
        <div class="actions">
          <a class="btn primary" id="c-watch">▶ Tiếp tục</a>
          <a class="btn" id="c-vocab">📚 Từ vựng</a>
        </div>
      </div>
    </section>

    <h2 class="section-title">Tất cả video <span id="count" class="muted"></span></h2>
    <section id="videos" class="video-grid"></section>
    <p id="empty" class="muted" hidden>Chưa có video nào. Thêm vào <code>data/videos/</code> rồi chạy <code>npm run build</code>.</p>
  </main>

  <script src="home.js"></script>
</body>
</html>
